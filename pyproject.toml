[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-jd-matcher"
version = "1.0.0"
description = "Resume and Job Description Matching System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bibesh Pyakurel" }]
dependencies = [
  "pypdf>=5.0.0",
  "nltk>=3.8.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.9.0",
  "reportlab>=4.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9"
]

[project.scripts]
resume-matcher = "resume_matcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["resume_&_job_description_matching_final.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
